  stake_units: 1
  ev_thresholds: [0, 0.03, 0.05, 0.08, 0.10]
  historical_execution: pinnacle_conservative_benchmark
  automatic_primary_threshold: null
promotion:
  visible_control: weekly_directed_raw
  requires_explicit_user_choice: true
  preserve_rollback: true
  require_r_python_parity: true
