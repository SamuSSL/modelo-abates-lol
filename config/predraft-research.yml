  total_market_leagues: 3
  team_total_complete_maps: 300
  team_total_leagues: 3
validation:
  folds:
    - {id: fold_01, test_start: 2023-10-01, test_end: 2023-12-31}
    - {id: fold_02, test_start: 2024-01-01, test_end: 2024-03-31}
    - {id: fold_03, test_start: 2024-04-01, test_end: 2024-06-30}
    - {id: fold_04, test_start: 2024-07-01, test_end: 2024-09-30}
    - {id: fold_05, test_start: 2024-10-01, test_end: 2024-12-31}
    - {id: fold_06, test_start: 2025-01-01, test_end: 2025-03-31}
    - {id: fold_07, test_start: 2025-04-01, test_end: 2025-06-30}
    - {id: fold_08, test_start: 2025-07-01, test_end: 2025-09-30}
    - {id: fold_09, test_start: 2025-10-01, test_end: 2025-12-31}
